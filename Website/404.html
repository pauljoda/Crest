  <title>Page Not Found — Crest</title>
  <script>
    // An address for a release without its own page, such as a version that was
    // never published on that channel, goes to the release that contains it,
    // then to the channel, then to the release notes.
    (() => {
      const match = location.pathname.match(/^\/releases(?:\/([^/]+))?(?:\/([^/]+))?(?:\/([^/]+))?/);
      if (!match) return;
      document.documentElement.classList.add("is-forwarding");
      const versionPattern = /^\d+\.\d+\.\d+$/;
      const platformAliases = { macos: "mac", iphone: "ios", ipad: "ios", ipados: "ios" };
      const channelAliases = { experimental: "development", beta: "testflight", appstore: "app-store" };
      const compare = (left, right) => {
        const a = left.split(".").map(Number);
        const b = right.split(".").map(Number);
        return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
      };
      const show = () => document.documentElement.classList.remove("is-forwarding");
      const go = (target) => {
        if (target === location.pathname) return show();
        location.replace(target + location.search + location.hash);
      };
      fetch("/releases/index.json")
        .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
        .then(({ platforms }) => {
          let [, platformSlug, channelSlug, version] = match.map((part) => part && decodeURIComponent(part).toLowerCase());
          platformSlug = platformAliases[platformSlug] || platformSlug;
          const platform = platforms[platformSlug];
          if (!platform) return go("/releases/");
          if (channelSlug && versionPattern.test(channelSlug)) {
            version = channelSlug;
            channelSlug = platform.defaultChannel;
          }
          channelSlug = channelAliases[channelSlug] || channelSlug;
          const releases = platform.channels[channelSlug];
          if (!releases) return go(`/releases/${platformSlug}/`);
          const channelPath = `/releases/${platformSlug}/${channelSlug}/`;
          if (!version || !versionPattern.test(version)) return go(channelPath);
          // Releases are newest first; the one containing a version is the oldest at or after it.
          const containing = releases.slice().reverse().find((release) => compare(release, version) >= 0);
          go(containing ? `${channelPath}${containing}/` : channelPath);
        })
        .catch(show);
    })();
  </script>
