name: Crest
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
options:
  bundleIdPrefix: com.pauldavis
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.1"
  xcodeVersion: "27.0"
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3U2R97HLXF
    DEVELOPMENT_LANGUAGE: en
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
      SWIFT_COMPILATION_MODE: singlefile
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.5
targets:
  Crest:
    type: application
    platform: macOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    sources:
      - path: CrestShared
        excludes:
          - Resources/CrestIcon/Sources
          - Resources/CrestIcon/Validation
      - path: CrestMac
    dependencies:
      - package: Sparkle
        product: Sparkle
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: CrestMac/Configuration/Crest.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CrestMac/Configuration/Crest-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Crest
        PRODUCT_BUNDLE_IDENTIFIER: com.pauldavis.crest
        PRODUCT_MODULE_NAME: Crest
        PRODUCT_NAME: Crest
    scheme:
      testTargets:
        - CrestTests
  CrestTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CrestTests
    dependencies:
      - target: Crest
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pauldavis.crest.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crest.app/Contents/MacOS/Crest"
  CrestMobile:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    sources:
      - path: CrestShared
        excludes:
          - Resources/CrestIcon/Sources
          - Resources/CrestIcon/Validation
      - path: CrestMobile
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: CrestMobile/Configuration/CrestMobile.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CrestMobile/Configuration/CrestMobile-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.1"
        CREST_MOBILE_BUNDLE_IDENTIFIER: com.pauldavis.crest
        PRODUCT_BUNDLE_IDENTIFIER: "$(CREST_MOBILE_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: CrestMobile
        PRODUCT_NAME: Crest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Crest
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - CrestMobileTests
  CrestMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrestMobileTests
    dependencies:
      - target: CrestMobile
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pauldavis.crest.mobile.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crest.app/Crest"
schemes:
  CrestKeychainIntegration:
    build:
      targets:
        Crest: all
        CrestTests: [test]
    test:
      environmentVariables:
        CREST_RUN_KEYCHAIN_INTEGRATION: "1"
      targets:
        - CrestTests
