name: Maintain Chromium fork
run-name: Chromium ${{ inputs.operation || 'check' }}

on:
  push:
    branches: [main]
    paths: [.github/workflows/chromium.yml]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Check upstream, build the pinned engine, build an upstream update as a draft PR, or check Crest's patches against an early stable release
        type: choice
        default: check
        options: [check, build, update, preflight]
      upstream_version:
        description: Chrome release on the fork's channel. Empty selects the latest eligible release.
        type: string
      allow_major:
        description: Allow a milestone update (a schedule allows one once it is full stable)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: crest-chromium-maintenance
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      operation: ${{ steps.plan.outputs.operation }}
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
      preflight: ${{ steps.plan.outputs.preflight }}
      exploited: ${{ steps.plan.outputs.exploited }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve the trusted integration branch and upstream release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'check' }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
          UPSTREAM_ENABLED: ${{ vars.CHROMIUM_UPSTREAM_ENABLED }}
          BUILD_ENABLED: ${{ vars.CHROMIUM_CI_ENABLED }}
        run: python3 Scripts/control-plane/resolve-chromium-upstream.py

  engine:
    needs: resolve
    if: needs.resolve.outputs.operation != 'check'
    # Only trusted dispatches and the integration branch reach this persistent Mac.
    # Never add a pull_request or pull_request_target trigger to this job.
    runs-on: [self-hosted, macOS, ARM64, crest-chromium]
    timeout-minutes: 1440
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pull_request: ${{ steps.update.outputs.pull_request || steps.rebase.outputs.pull_request }}
    env:
      CREST_CHROMIUM_WORKSPACE: ${{ vars.CHROMIUM_WORKSPACE }}
      CHROMIUM_SDK: ${{ vars.CHROMIUM_SDK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check managed build tools
        run: |
          test -n "$CREST_CHROMIUM_WORKSPACE"
          test -d "$CHROMIUM_SDK"
          test -x "$CREST_CHROMIUM_WORKSPACE/tools/bin/python"
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo "$CREST_CHROMIUM_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: Test fork and release contracts
        run: python -m unittest discover -s Scripts/Tests
      - name: Check Crest's patches against the release
        id: plan
        if: needs.resolve.outputs.operation == 'update'
        env:
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR: ${{ needs.resolve.outputs.major }}
        run: |
          # Planning changes no source, so it runs while a session holds the tree, into this job's own report.
          args=(plan --version "$UPSTREAM_VERSION" --when-published --report "$RUNNER_TEMP/chromium-plan-$UPSTREAM_VERSION")
          if [[ "$MAJOR" == true ]]; then args+=(--allow-major); fi
          python Scripts/control-plane/chromium-fork.py "${args[@]}"
      - name: Open the rebase as a draft for review
        id: rebase
        # Crest's patches stop the build: a session resolves them on this draft's branch.
        if: steps.plan.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          REVIEWER: ${{ vars.CHROMIUM_UPDATE_REVIEWER }}
          EXPLOITED: ${{ needs.resolve.outputs.exploited }}
          REPORT: ${{ steps.plan.outputs.report }}
        run: |
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          args=(--base-sha "$BASE_SHA" --repository "$GITHUB_REPOSITORY" --rebase "$REPORT")
          if [[ -n "$REVIEWER" ]]; then args+=(--reviewer "$REVIEWER"); fi
          if [[ "$EXPLOITED" == true ]]; then args+=(--exploited); fi
          python Scripts/control-plane/publish-chromium-update.py "${args[@]}"
      - name: Prepare and compile the engine
        id: build
        if: needs.resolve.outputs.operation == 'build' || steps.plan.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ needs.resolve.outputs.operation }}
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR: ${{ needs.resolve.outputs.major }}
          JOBS: ${{ vars.CHROMIUM_BUILD_JOBS || '8' }}
        run: |
          args=("$OPERATION" --sdk "$CHROMIUM_SDK" --jobs "$JOBS")
          if [[ "$OPERATION" == update ]]; then
            # A session or another engine build may own the shared tree; the update then waits for the next check.
            args+=(--version "$UPSTREAM_VERSION" --when-idle)
            # A full stable milestone may replace the previous one's source, once that engine is published.
            if [[ "$MAJOR" == true ]]; then args+=(--allow-major --replace-published-pinned); fi
          fi
          python Scripts/control-plane/chromium-fork.py "${args[@]}"
      - name: Publish the pinned engine
        if: needs.resolve.outputs.operation == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SOURCE: ${{ steps.build.outputs.source }}
        run: |
          python Scripts/control-plane/publish-chromium-engine.py \
            --source "$ENGINE_SOURCE" --ninja "$CREST_CHROMIUM_WORKSPACE/tools/bin/ninja" \
            --repository "$GITHUB_REPOSITORY"
      - name: Hold the engine as a draft candidate
        id: candidate
        # Release packaging asks only for the published engine's tag, so it never reads this draft.
        if: needs.resolve.outputs.operation == 'update' && steps.build.outcome == 'success' && steps.build.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SOURCE: ${{ steps.build.outputs.source }}
        run: |
          python Scripts/control-plane/publish-chromium-engine.py --candidate \
            --source "$ENGINE_SOURCE" --ninja "$CREST_CHROMIUM_WORKSPACE/tools/bin/ninja" \
            --repository "$GITHUB_REPOSITORY"
      - name: Open the update as a draft for review
        id: update
        # The engine stays unpublished: a maintainer tests it, publishes it and merges.
        if: steps.candidate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          REVIEWER: ${{ vars.CHROMIUM_UPDATE_REVIEWER }}
          EXPLOITED: ${{ needs.resolve.outputs.exploited }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: |
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          args=(--base-sha "$BASE_SHA" --repository "$GITHUB_REPOSITORY"
                --receipt "$CREST_CHROMIUM_WORKSPACE/last-build.json" --candidate "$CANDIDATE")
          if [[ -n "$REVIEWER" ]]; then args+=(--reviewer "$REVIEWER"); fi
          if [[ "$EXPLOITED" == true ]]; then args+=(--exploited); fi
          python Scripts/control-plane/publish-chromium-update.py "${args[@]}"
      - name: Alert that the release fixes a vulnerability exploited in the wild
        # A failed run emails the maintainer on top of the draft's label and mention.
        if: needs.resolve.outputs.exploited == 'true' && (steps.update.outcome == 'success' || steps.rebase.outcome == 'success')
        env:
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.version }}
          PULL_REQUEST: ${{ steps.update.outputs.pull_request || steps.rebase.outputs.pull_request }}
        run: |
          echo "::error title=Chromium::Chromium $UPSTREAM_VERSION fixes a vulnerability exploited in the wild. Review $PULL_REQUEST and ship it today."
          exit 1

  preflight:
    needs: resolve
    if: needs.resolve.outputs.preflight != ''
    # Only trusted dispatches and the integration branch reach this persistent Mac.
    # Never add a pull_request or pull_request_target trigger to this job.
    runs-on: [self-hosted, macOS, ARM64, crest-chromium]
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      CREST_CHROMIUM_WORKSPACE: ${{ vars.CHROMIUM_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check managed build tools
        run: |
          test -n "$CREST_CHROMIUM_WORKSPACE"
          test -x "$CREST_CHROMIUM_WORKSPACE/tools/bin/python"
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo "$CREST_CHROMIUM_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: Check Crest's patches against the early stable release
        id: plan
        env:
          PREFLIGHT: ${{ needs.resolve.outputs.preflight }}
        run: |
          # Nothing is built for an early stable release; the plan changes no source.
          python Scripts/control-plane/chromium-fork.py plan --allow-major --version "$PREFLIGHT" --when-published \
            --report "$RUNNER_TEMP/chromium-preflight-$PREFLIGHT"
      - name: Post the patch check as a draft
        # One draft per early stable release, listing what a session must resolve, or that nothing needs it.
        if: steps.plan.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          REVIEWER: ${{ vars.CHROMIUM_UPDATE_REVIEWER }}
          REPORT: ${{ steps.plan.outputs.report }}
        run: |
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          args=(--base-sha "$BASE_SHA" --repository "$GITHUB_REPOSITORY" --preflight "$REPORT")
          if [[ -n "$REVIEWER" ]]; then args+=(--reviewer "$REVIEWER"); fi
          python Scripts/control-plane/publish-chromium-update.py "${args[@]}"
