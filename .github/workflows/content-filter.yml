name: Content filter

# The core links a prebuilt content filter that a maintainer publishes once per
# key (Scripts/control-plane/publish-content-filter.py). This rebuilds it from
# source, so the published archive is shown to hold what the sources compile to,
# and on main it requires that archive to be published.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - CrestCore/native/ContentFilter/**
      - Scripts/control-plane/content_filter.py
      - Scripts/control-plane/fetch-content-filter.py
      - Scripts/control-plane/publish-content-filter.py
      - .github/workflows/content-filter.yml
  push:
    branches: [main]
    paths:
      - CrestCore/native/ContentFilter/**
      - Scripts/control-plane/content_filter.py
      - Scripts/control-plane/fetch-content-filter.py
      - Scripts/control-plane/publish-content-filter.py
      - .github/workflows/content-filter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-filter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild the content filter from source
    # A draft pull request waits until it is ready for review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every Apple library with the lock
        run: python3 Scripts/control-plane/content_filter.py build --check --family apple

      - name: Test the content filter
        working-directory: CrestCore/native/ContentFilter
        run: cargo test --release --locked

      - name: Require the locked archive to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 Scripts/control-plane/content_filter.py published
          else
            python3 Scripts/control-plane/content_filter.py published --require
          fi

  # The Windows libraries are built on Windows, as the Apple ones are on a Mac.
  rebuild-windows:
    name: Rebuild the Windows content filter from source
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every Windows library with the lock
        run: py -3 Scripts/control-plane/content_filter.py build --check --family windows
