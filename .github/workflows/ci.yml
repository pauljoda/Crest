name: Build Crest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Public-source compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the publishable source and dependency licenses
        run: |
          git diff --check
          Scripts/check-public-source.py
          Scripts/audit-licenses.py

  app:
    name: Compile macOS and iOS
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure build tools are available
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v rg >/dev/null || brew install ripgrep

      - name: Generate the project
        run: Scripts/bootstrap.sh

      - name: Build macOS
        run: |
          xcodebuild build \
            -project Crest.xcodeproj \
            -scheme Crest \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS
        run: |
          xcodebuild build \
            -project Crest.xcodeproj \
            -scheme CrestMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  website:
    name: Website and Help Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HelpCenter/package-lock.json

      - name: Build Help Center
        working-directory: HelpCenter
        run: |
          npm ci
          npm run build
