name: Build Crest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to validate before publication
        required: true
        type: string
      skip_apple_builds:
        description: Run only the checks; the release's signing job builds the Mac product itself
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Public-source compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          # The release calls this workflow for a merged PR. A fork PR's merge
          # commit is already on main, but checkout refuses it under
          # pull_request_target unless the step opts in.
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - name: Check the publishable source and dependency licenses
        run: |
          git diff --check
          Scripts/check-public-source.py
          python3 Scripts/release_note_catalog.py
          Scripts/audit-licenses.py

  # Pull requests never set the version. One that changes the apps adds its
  # release notes as a new fragment, which takes the version of the commit
  # that merges it, so pull requests merge in any order.
  release-notes:
    name: Version and release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false

      - name: Check that the pull request keeps the version and adds its notes
        run: python3 Scripts/release_note_catalog.py --pull-request HEAD^1

  # Tests that need macOS tools, such as plutil, skip here. A macOS build job
  # runs the whole suite again on its runner.
  script-tests:
    name: Release and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - name: Install the repository shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Test retained script contracts
        run: python3 -m unittest discover -s Scripts/Tests

  core:
    name: .NET core contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - name: Install the repository shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: CrestCore/global.json

      - name: Test core contracts
        working-directory: CrestCore
        run: dotnet test tests/CrestCore.Tests/CrestCore.Tests.csproj --nologo

      - name: Check core analyzers and code style
        run: Scripts/control-plane/lint-dotnet.sh

      - name: Check architecture boundaries
        run: python3 Scripts/check-architecture.py

  # Pull requests and pushes to main build only the apps their files can
  # affect; release validation and manual runs build both.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac: ${{ steps.apple.outputs.build == 'true' && steps.areas.outputs.mac || 'false' }}
      ios: ${{ steps.apple.outputs.build == 'true' && steps.areas.outputs.ios || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}
          fetch-depth: 2

      - name: Decide which apps the change can affect
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 Scripts/ci-changed-areas.py >> "$GITHUB_OUTPUT"

      # The Apple builds are the expensive part, so they run once per change.
      # A draft pull request waits until it is ready for review. A push to main
      # from a merged pull request was built on its branch, and the release
      # builds the merge commit again. The release's own validation skips them
      # because its signing job builds the Mac product. A direct push to main
      # has no other check, so it builds.
      - name: Decide whether this run builds the Apple apps
        id: apple
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          SKIP: ${{ inputs.skip_apple_builds }}
        run: |
          build=true
          if [[ "$SKIP" == true || ( "$EVENT_NAME" == pull_request && "$DRAFT" == true ) ]]; then
            build=false
          elif [[ "$EVENT_NAME" == push ]]; then
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length' || echo 0)
            if [[ "$merged" -gt 0 ]]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Apple builds: $build" >&2

  # The three app builds run side by side on separate runners.
  chromium-host:
    name: Build Chromium product host
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - uses: ./.github/actions/prepare-apple-build

      - uses: ./.github/actions/check-sources

      - name: Build Chromium product host
        run: |
          xcodebuild build \
            -project Crest.xcodeproj \
            -scheme CrestChromiumUIProduct \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check native contracts against the built core
        run: |
          core="$RUNNER_TEMP/crest-build-derived-data/Build/Products/Release/CrestCore"
          clang -std=c11 -Wall -Wextra -Werror -I CrestContracts/include \
            CrestContracts/tests/native_abi.c "$core/CrestCore.Native.dylib" \
            -Wl,-rpath,"$core" -o "$core/native-abi"
          "$core/native-abi"
          clang++ -std=c++20 -Wall -Wextra -Werror -Wconversion -I CrestContracts/include \
            CrestContracts/tests/engine_abi.cc "$core/CrestCore.Native.dylib" \
            -Wl,-rpath,"$core" -o "$core/engine-abi"
          "$core/engine-abi"

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  mac-app:
    name: Build macOS
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - uses: ./.github/actions/prepare-apple-build

      # One Release build compiles the app and CrestTests without launching the
      # hosted suite, which stays a manual run. CREST_TEST_FIXTURES compiles in
      # the fixtures the tests use; only this command passes it, so shipped
      # builds never carry them.
      - name: Build macOS and its tests
        run: |
          xcodebuild build-for-testing \
            -project Crest.xcodeproj \
            -scheme Crest \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) CREST_TEST_FIXTURES'

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  ios-app:
    name: Build iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - uses: ./.github/actions/prepare-apple-build

      # The Chromium host job lints Swift and tests the script contracts with
      # macOS tools whenever it runs; an iOS-only change skips that job, so
      # this one does both instead.
      - uses: ./.github/actions/check-sources
        if: needs.changes.outputs.mac != 'true'

      # One Release build compiles the app and CrestMobileTests without running
      # them, with the test fixtures compiled in as in the macOS job.
      - name: Build iOS and its tests
        run: |
          xcodebuild build-for-testing \
            -project Crest.xcodeproj \
            -scheme CrestMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) CREST_TEST_FIXTURES'

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  help-center:
    name: Help Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event.pull_request.merged == true }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HelpCenter/package-lock.json

      - name: Build Help Center
        working-directory: HelpCenter
        run: |
          npm ci
          npm run build
