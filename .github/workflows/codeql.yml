name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift security analysis
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      - name: Ensure build tools are available
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v rg >/dev/null || brew install ripgrep

      - name: Build analyzed target
        env:
          CREST_ISOLATED_SESSION: "1"
        run: |
          Scripts/bootstrap.sh
          xcodebuild build \
            -project Crest.xcodeproj \
            -scheme Crest \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/crest-codeql-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-codeql-derived-data" -depth -delete 2>/dev/null || true
